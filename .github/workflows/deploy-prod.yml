name: Deploy Front (prod)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.NEW_SERVER_HOST }}
          username: ${{ secrets.NEW_SERVER_USER }}
          key: ${{ secrets.NEW_SERVER_KEY }}
          command_timeout: 30m
          script: |
            cd /home/ontid/Klick2026Edtech-front
            git fetch origin
            git checkout -B main origin/main
            git pull --ff-only
            docker network inspect klick-network-prod >/dev/null 2>&1 || docker network create klick-network-prod
            docker compose -p klick-front-prod --env-file=.env.prod down --remove-orphans
            if docker container inspect klick-front-prod >/dev/null 2>&1; then
              project="$(docker container inspect -f '{{ index .Config.Labels \"com.docker.compose.project\" }}' klick-front-prod)"
              service="$(docker container inspect -f '{{ index .Config.Labels \"com.docker.compose.service\" }}' klick-front-prod)"
              case "$project:$service" in
                klick-front-prod:react-app|klick2026edtech-front:react-app)
                  docker rm -f klick-front-prod
                  ;;
                *)
                  echo "Refusing to remove klick-front-prod owned by Compose project/service: $project/$service"
                  exit 1
                  ;;
              esac
            fi
            docker compose -p klick-front-prod --env-file=.env.prod build
            docker compose -p klick-front-prod --env-file=.env.prod up -d
