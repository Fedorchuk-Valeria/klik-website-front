name: Deploy Front (prod)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          script: |
            cd /home/ontid/Klick2026Edtech-front
            git fetch origin
            git checkout -B main origin/main
            git pull --ff-only
            export $(cat .env.prod | xargs)
            docker compose -p klick-front-prod --env-file=.env.prod down --remove-orphans
            docker compose -p klick-front-prod --env-file=.env.prod up -d --build
