name: Deploy Front (dev)

on:
  push:
    branches:
      - develop

concurrency:
  group: deploy-front-shared-prod
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          command_timeout: 30m
          script: |
            set -eu

            cd /home/ontid/Klick2026Edtech-front
            git fetch origin
            git checkout -B develop origin/develop
            git pull --ff-only
            export $(cat .env.prod | xargs)
            docker network inspect klick-network-prod >/dev/null 2>&1 || docker network create klick-network-prod
            docker compose -p klick2026edtech-front --env-file=.env.prod down --remove-orphans
            if docker container inspect klick-front-prod >/dev/null 2>&1; then
              project="$(docker container inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' klick-front-prod)"
              if [ "$project" != "klick2026edtech-front" ]; then
                echo "Refusing to remove klick-front-prod owned by Compose project: $project"
                exit 1
              fi
              docker rm -f klick-front-prod
            fi
            docker compose -p klick2026edtech-front --env-file=.env.prod build
            docker compose -p klick2026edtech-front --env-file=.env.prod up -d
